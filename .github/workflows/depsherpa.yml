name: DepSherpa

on:
  pull_request:
    paths:
      - package.json

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Investigate the upgrade in isolation
        uses: cfngc4594/dep-sherpa@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          openai-base-url: ${{ vars.OPENAI_BASE_URL }}
          model: ${{ vars.OPENAI_MODEL }}
          attempt-repair: "true"

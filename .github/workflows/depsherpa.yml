name: DepSherpa

on:
  pull_request:
    paths:
      - package.json

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Investigate the upgrade in isolation
        uses: cfngc4594/dep-sherpa@main
